<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beheer | Koo-sjiete RKVV Vijlen</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f1e9;
color: #2f3b2f;
}

.page {
max-width: 1200px;
margin: 0 auto;
padding: 24px;
}

.card {
background: white;
border-radius: 16px;
padding: 24px;
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
}

h1 {
margin-top: 0;
}

input,
button {
font: inherit;
}

input {
width: 100%;
padding: 12px;
border: 1px solid #ccc;
border-radius: 8px;
}

button {
border: 0;
border-radius: 8px;
padding: 12px 18px;
background: #52644a;
color: white;
font-weight: bold;
cursor: pointer;
}

.hidden {
display: none;
}

.error {
color: #a43737;
margin-top: 12px;
}

.stats {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 12px;
margin-bottom: 24px;
}

.stat {
background: #f7f7f7;
border-radius: 12px;
padding: 16px;
}

.stat strong {
display: block;
font-size: 26px;
margin-top: 6px;
}

.search-box {
margin: 24px 0;
padding: 18px;
background: #f7f7f7;
border-radius: 12px;
}

.search-row {
display: flex;
gap: 10px;
flex-wrap: wrap;
}

.search-row input {
flex: 1;
min-width: 180px;
}

.result {
margin-top: 14px;
padding: 14px;
border-radius: 10px;
background: white;
border: 1px solid #ddd;
}

.table-wrap {
overflow-x: auto;
margin-top: 18px;
}

table {
width: 100%;
border-collapse: collapse;
min-width: 800px;
}

th,
td {
text-align: left;
padding: 12px;
border-bottom: 1px solid #e2e2e2;
vertical-align: top;
}

th {
background: #f5f5f5;
}

.status {
display: inline-block;
padding: 5px 9px;
border-radius: 999px;
font-size: 13px;
font-weight: bold;
}

.status-betaald {
background: #e3f4e6;
color: #2d6a36;
}

@media (max-width: 700px) {
.page {
padding: 14px;
}

.stats {
grid-template-columns: 1fr;
}

.card {
padding: 18px;
}
}
</style>
</head>

<body>

<div class="page">

<section id="loginCard" class="card">
<h1>Beheer Koo-sjiete</h1>

<p>Log in om de betaalde bestellingen te bekijken.</p>

<input
id="password"
type="password"
placeholder="Beheerwachtwoord"
autocomplete="current-password"
>

<br><br>

<button id="loginBtn">Inloggen</button>

<div id="loginError" class="error"></div>
</section>

<section id="beheerCard" class="card hidden">

<h1>Beheer Koo-sjiete</h1>

<div class="stats">
<div class="stat">
Betaalde bestellingen
<strong id="statBestellingen">0</strong>
</div>

<div class="stat">
Verkochte kavels
<strong id="statVerkocht">0</strong>
</div>

<div class="stat">
Totale opbrengst
<strong id="statOpbrengst">€ 0,00</strong>
</div>
</div>

<div class="search-box">
<h2>Kavel zoeken</h2>

<div class="search-row">
<input
id="kavelSearch"
type="search"
placeholder="Bijvoorbeeld A20"
>

<button id="kavelSearchBtn">
Zoeken
</button>
</div>

<div id="kavelResult"></div>
</div>

<h2>Betaalde bestellingen</h2>

<div id="beheerError" class="error"></div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Datum</th>
<th>Naam</th>
<th>Contact</th>
<th>Kavels</th>
<th>Bedrag</th>
<th>Status</th>
</tr>
</thead>

<tbody id="ordersBody"></tbody>
</table>
</div>

</section>

</div>

<script>
const loginCard = document.getElementById('loginCard');
const beheerCard = document.getElementById('beheerCard');

const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');

const beheerError = document.getElementById('beheerError');
const ordersBody = document.getElementById('ordersBody');

const statBestellingen = document.getElementById('statBestellingen');
const statVerkocht = document.getElementById('statVerkocht');
const statOpbrengst = document.getElementById('statOpbrengst');

const kavelSearch = document.getElementById('kavelSearch');
const kavelSearchBtn = document.getElementById('kavelSearchBtn');
const kavelResult = document.getElementById('kavelResult');

let bestellingen = [];
let kavels = [];

function escapeHtml(value) {
return String(value ?? '')
.replaceAll('&', '&amp;')
.replaceAll('<', '&lt;')
.replaceAll('>', '&gt;')
.replaceAll('"', '&quot;')
.replaceAll("'", '&#039;');
}

function formatBedrag(value) {
return Number(value || 0).toLocaleString('nl-NL', {
style: 'currency',
currency: 'EUR'
});
}

function formatDatum(value) {
if (!value) {
return '-';
}

return new Date(value).toLocaleString('nl-NL', {
dateStyle: 'short',
timeStyle: 'short'
});
}

function betaaldeBestellingen() {
return bestellingen.filter(
bestelling => bestelling.status === 'betaald'
);
}

function updateStats() {
const betaald = betaaldeBestellingen();

const verkochtAantal = betaald.reduce(
(totaal, bestelling) =>
totaal + (bestelling.kavels || []).length,
0
);

const opbrengst = betaald.reduce(
(totaal, bestelling) =>
totaal + Number(bestelling.totaalbedrag || 0),
0
);

statBestellingen.textContent = betaald.length;
statVerkocht.textContent = verkochtAantal;
statOpbrengst.textContent = formatBedrag(opbrengst);
}

function renderBestellingen() {
const betaald = betaaldeBestellingen();

ordersBody.innerHTML = '';

if (betaald.length === 0) {
ordersBody.innerHTML = `
<tr>
<td colspan="6">Nog geen betaalde bestellingen.</td>
</tr>
`;
return;
}

for (const bestelling of betaald) {
const row = document.createElement('tr');

row.innerHTML = `
<td>${escapeHtml(formatDatum(bestelling.created_at))}</td>

<td>
<strong>${escapeHtml(bestelling.naam || '-')}</strong>
</td>

<td>
${escapeHtml(bestelling.email || '-')}
<br>
${escapeHtml(bestelling.telefoon || '-')}
</td>

<td>
${escapeHtml((bestelling.kavels || []).join(', ') || '-')}
</td>

<td>
${escapeHtml(formatBedrag(bestelling.totaalbedrag))}
</td>

<td>
<span class="status status-betaald">
betaald
</span>
</td>
`;

ordersBody.appendChild(row);
}
}

function zoekKavel() {
const zoekterm = kavelSearch.value
.trim()
.toUpperCase();

kavelResult.innerHTML = '';

if (!zoekterm) {
return;
}

const kavel = kavels.find(
item => item.kavelnummer.toUpperCase() === zoekterm
);

if (!kavel) {
kavelResult.innerHTML = `
<div class="result">
Kavel <strong>${escapeHtml(zoekterm)}</strong> bestaat niet.
</div>
`;
return;
}

const bestelling = betaaldeBestellingen().find(
bestelling =>
(bestelling.kavels || []).includes(kavel.kavelnummer)
);

if (bestelling) {
kavelResult.innerHTML = `
<div class="result">
<strong>${escapeHtml(kavel.kavelnummer)}</strong>
is verkocht aan
<strong>${escapeHtml(bestelling.naam || '-')}</strong>.

<br><br>

E-mail:
${escapeHtml(bestelling.email || '-')}

<br>

Telefoon:
${escapeHtml(bestelling.telefoon || '-')}
</div>
`;
return;
}

if (kavel.status === 'gereserveerd') {
kavelResult.innerHTML = `
<div class="result">
<strong>${escapeHtml(kavel.kavelnummer)}</strong>
is momenteel gereserveerd, maar nog niet betaald.
</div>
`;
return;
}

kavelResult.innerHTML = `
<div class="result">
<strong>${escapeHtml(kavel.kavelnummer)}</strong>
is beschikbaar.
</div>
`;
}

async function loadAdminData() {
beheerError.textContent = '';

try {
const response = await fetch('/api/admin/data', {
credentials: 'same-origin'
});

if (response.status === 401) {
loginCard.classList.remove('hidden');
beheerCard.classList.add('hidden');
return;
}

const data = await response.json();

if (!response.ok) {
throw new Error(
data.error || 'Beheerdata kon niet worden geladen.'
);
}

bestellingen = data.bestellingen || [];
kavels = data.kavels || [];

loginCard.classList.add('hidden');
beheerCard.classList.remove('hidden');

updateStats();
renderBestellingen();

} catch (error) {
console.error(error);
beheerError.textContent = error.message;
}
}

async function login() {
loginError.textContent = '';

const wachtwoord = passwordInput.value;

if (!wachtwoord) {
loginError.textContent = 'Vul het wachtwoord in.';
return;
}

loginBtn.disabled = true;
loginBtn.textContent = 'Bezig...';

try {
const response = await fetch('/api/admin/login', {
method: 'POST',
headers: {
'Content-Type': 'application/json'
},
credentials: 'same-origin',
body: JSON.stringify({
wachtwoord
})
});

const data = await response.json();

if (!response.ok) {
throw new Error(
data.error || 'Inloggen is mislukt.'
);
}

passwordInput.value = '';
await loadAdminData();

} catch (error) {
loginError.textContent = error.message;
} finally {
loginBtn.disabled = false;
loginBtn.textContent = 'Inloggen';
}
}

loginBtn.addEventListener('click', login);

passwordInput.addEventListener('keydown', event => {
if (event.key === 'Enter') {
login();
}
});

kavelSearchBtn.addEventListener('click', zoekKavel);

kavelSearch.addEventListener('keydown', event => {
if (event.key === 'Enter') {
zoekKavel();
}
});

loadAdminData();
</script>

</body>
</html>
